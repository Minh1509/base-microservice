_format_version: '3.0'
_transform: true

services:
  - name: api-gateway
    # api-gateway chạy trên máy host lúc dev; Kong gọi ra qua host.docker.internal
    url: http://host.docker.internal:3000
    routes:
      - name: api-gateway-root
        paths:
          - /
        strip_path: false
        preserve_host: false
    plugins:
      - name: cors
        config:
          origins: ['*']
          methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
          headers: ['Accept', 'Authorization', 'Content-Type']
          credentials: true
          max_age: 3600
      - name: rate-limiting
        config:
          minute: 120
          policy: local
