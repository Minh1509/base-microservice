# Prod: infra + apps in containers
services:
  postgres:
    image: postgres:16.2-alpine3.19
    container_name: bm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: bm-redis
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?REDIS_PASSWORD required in .env}',
      ]
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    container_name: bm-kafka
    restart: unless-stopped
    ports:
      - '${KAFKA_EXTERNAL_PORT:-9094}:9094'
    environment:
      KAFKA_CFG_NODE_ID: '1'
      KAFKA_CFG_PROCESS_ROLES: 'broker,controller'
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CFG_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094'
      KAFKA_CFG_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094'
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      ALLOW_PLAINTEXT_LISTENER: 'yes'
      KAFKA_KRAFT_CLUSTER_ID: 'base-microservice-cluster'
    volumes:
      - ./data/kafka:/bitnami/kafka
    healthcheck:
      test:
        [
          'CMD',
          '/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh',
          '--bootstrap-server',
          'localhost:9092',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bm-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '${KAFKA_UI_PORT:-8080}:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: 'base-microservice'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:9092'
      DYNAMIC_CONFIG_ENABLED: 'true'

  api-gateway:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    image: bm/api-gateway:${IMAGE_TAG:-1.0.0}
    container_name: bm-api-gateway
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BROKERS: kafka:9092
    env_file:
      - .env.shared
      - apps/api-gateway/.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - '${API_GATEWAY_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  auth-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    image: bm/auth-service:${IMAGE_TAG:-1.0.0}
    container_name: bm-auth-service
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BROKERS: kafka:9092
    env_file:
      - .env.shared
      - apps/auth-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  user-service:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    image: bm/user-service:${IMAGE_TAG:-1.0.0}
    container_name: bm-user-service
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BROKERS: kafka:9092
    env_file:
      - .env.shared
      - apps/user-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
